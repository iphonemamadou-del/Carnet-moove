<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="description" content="Carnet — vos notes, hors-ligne, toujours là." />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <title>Carnet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1a1a1a;
      --muted: #6b6457;
      --accent: #c8442a;
      --paper: #fdfaf3;
      --line: rgba(26, 26, 26, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Fraunces', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      background-image:
        radial-gradient(at 20% 10%, rgba(200, 68, 42, 0.06) 0, transparent 50%),
        radial-gradient(at 80% 90%, rgba(26, 26, 26, 0.04) 0, transparent 50%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 1.25rem 1.5rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      font-variation-settings: "opsz" 144;
    }

    .brand span { color: var(--accent); font-style: italic; }

    .count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem 8rem;
    }

    .empty {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    .empty h2 {
      font-size: 1.5rem;
      font-weight: 400;
      font-style: italic;
      margin-bottom: 0.5rem;
    }

    .note {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 8px 24px -16px rgba(0,0,0,0.1);
      animation: in 0.3s ease;
      position: relative;
    }

    @keyframes in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .note-text {
      font-size: 1.0625rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .note-meta {
      margin-top: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      font-family: inherit;
      font-size: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      transition: color 0.2s;
    }

    .del:hover, .del:active { color: var(--accent); }

    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
      display: flex;
      gap: 0.5rem;
    }

    textarea {
      flex: 1;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.75rem 1rem;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1rem;
      color: var(--ink);
      resize: none;
      max-height: 120px;
      min-height: 44px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent); }

    .add {
      background: var(--ink);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      padding: 0 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s;
    }

    .add:hover, .add:active { background: var(--accent); }
    .add:disabled { opacity: 0.3; cursor: not-allowed; }

    .offline-badge {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 0.5rem);
      right: 0.5rem;
      background: var(--accent);
      color: white;
      padding: 0.25rem 0.6rem;
      border-radius: 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .offline-badge.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="offline-badge" id="offlineBadge">Hors-ligne</div>

  <header>
    <div class="brand">Car<span>net</span></div>
    <div class="count" id="count">0 notes</div>
  </header>

  <main id="list">
    <div class="empty" id="empty">
      <h2>Rien encore.</h2>
      <p>Écrivez votre première note ci-dessous.</p>
    </div>
  </main>

  <div class="composer">
    <textarea id="input" placeholder="Une pensée…" rows="1"></textarea>
    <button class="add" id="addBtn" disabled>Ajouter</button>
  </div>

  <script>
    const STORAGE_KEY = 'carnet.notes.v1';
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const inputEl = document.getElementById('input');
    const addBtn = document.getElementById('addBtn');
    const countEl = document.getElementById('count');
    const offlineBadge = document.getElementById('offlineBadge');

    let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function fmtDate(ts) {
      const d = new Date(ts);
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function render() {
      listEl.querySelectorAll('.note').forEach(n => n.remove());
      countEl.textContent = `${notes.length} note${notes.length > 1 ? 's' : ''}`;
      emptyEl.style.display = notes.length ? 'none' : 'block';

      notes.forEach(note => {
        const el = document.createElement('article');
        el.className = 'note';
        el.innerHTML = `
          <div class="note-text"></div>
          <div class="note-meta">
            <span>${fmtDate(note.ts)}</span>
            <button class="del" data-id="${note.id}">Supprimer</button>
          </div>
        `;
        el.querySelector('.note-text').textContent = note.text;
        listEl.appendChild(el);
      });
    }

    function addNote() {
      const text = inputEl.value.trim();
      if (!text) return;
      notes.unshift({ id: Date.now().toString(36), text, ts: Date.now() });
      save();
      inputEl.value = '';
      inputEl.style.height = 'auto';
      addBtn.disabled = true;
      render();
    }

    inputEl.addEventListener('input', () => {
      addBtn.disabled = !inputEl.value.trim();
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    addBtn.addEventListener('click', addNote);

    listEl.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        const id = e.target.dataset.id;
        notes = notes.filter(n => n.id !== id);
        save();
        render();
      }
    });

    function updateOnline() {
      offlineBadge.classList.toggle('show', !navigator.onLine);
    }
    window.addEventListener('online', updateOnline);
    window.addEventListener('offline', updateOnline);
    updateOnline();

    render();

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW:', err));
      });
    }
  </script>
</body>
</html>
